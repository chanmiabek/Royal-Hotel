{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<section class="container" style="padding:72px 15px;text-align:center">
  <h1>{% trans "Complete your booking" %}</h1>
  <p>{% trans "Choose a secure payment method in the payment card." %}</p>
  <button class="btn btn-primary" type="button" data-payment-open>{% trans "Choose payment method" %}</button>
</section>
{% include 'includes/payment_card.html' %}
{% endblock %}
{% block extra_js %}<script>window.addEventListener('load',function(){document.querySelector('[data-payment-open]')?.click();});</script>{% endblock %}
