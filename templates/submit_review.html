{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="container py-5">
    <div class="section-header">
        <h2>{% trans "Leave a Review" %}</h2>
        <p>Booking #{{ booking.id }} - {{ booking.room.title }}</p>
    </div>
    <div class="row">
        <div class="col-md-8 mx-auto">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>{% trans "Rating" %}</label>
                    <select name="rating" class="form-control" required>
                        <option value="">{% trans "Select rating" %}</option>
                        <option value="5">5 - {% trans "Excellent" %}</option>
                        <option value="4">4 - {% trans "Very Good" %}</option>
                        <option value="3">3 - {% trans "Good" %}</option>
                        <option value="2">2 - {% trans "Fair" %}</option>
                        <option value="1">1 - {% trans "Poor" %}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>{% trans "Title" %}</label>
                    <input type="text" name="title" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>{% trans "Comment" %}</label>
                    <textarea name="comment" class="form-control" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">{% trans "Submit Review" %}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
