{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="container">
    <div class="section-header">
        <h2>{% trans "Payment Failed" %}</h2>
        <p>{% trans "Your payment did not complete. Please try again." %}</p>
    </div>

    <div class="row">
        <div class="col-12">
            <p><strong>{% trans "Booking ID:" %}</strong> {{ booking.id }}</p>
            <a class="btn btn-primary" href="{% url 'payment_page' booking.id %}">{% trans "Try Again" %}</a>
        </div>
    </div>
</div>
{% endblock %}
