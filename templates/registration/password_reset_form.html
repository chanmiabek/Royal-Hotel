{% extends 'base.html' %}
{% load i18n %}
{% block extra_css %}
<style>
    .auth-shell {
        background: transparent;
        padding: 60px 0;
    }
    .auth-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
        padding: 28px;
    }
    .auth-title {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 8px;
    }
    .auth-subtitle {
        color: #64748b;
        margin-bottom: 20px;
    }
    .auth-card .form-control {
        border-radius: 12px;
        border-color: #e2e8f0;
        box-shadow: none;
    }
    .auth-card .form-control:focus {
        border-color: #f5c542;
        box-shadow: 0 0 0 0.2rem rgba(245, 197, 66, 0.2);
    }
    .auth-card .btn-primary {
        border-radius: 999px;
        padding: 10px 22px;
        font-weight: 600;
    }
</style>
{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-card">
                    <h2 class="auth-title">{% trans "Reset Your Password" %}</h2>
                    <p class="auth-subtitle">{% trans "Enter your email and we will send you a reset link." %}</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.email.label_tag }}
                        {{ form.email }}
                        <button type="submit" class="btn btn-primary mt-3">{% trans "Send Reset Link" %}</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
