{% extends 'base.html' %}
{% load i18n %}
{% block extra_css %}
<style>
    .auth-shell {
        background: transparent;
        padding: 60px 0;
    }
    .auth-card {
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.15);
        padding: 28px;
        text-align: center;
    }
    .auth-title {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 8px;
    }
    .auth-subtitle {
        color: #64748b;
        margin-bottom: 20px;
    }
    .auth-card .btn-outline-primary {
        border-radius: 999px;
        font-weight: 600;
        padding: 8px 18px;
    }
</style>
{% endblock %}
{% block content %}
<section class="auth-shell">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-card">
                    <h2 class="auth-title">{% trans "Check Your Email" %}</h2>
                    <p class="auth-subtitle">{% trans "If the email exists, we have sent a reset link." %}</p>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary">{% trans "Back to Login" %}</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
